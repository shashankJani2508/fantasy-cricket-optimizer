# Dream11 team rules per format. FILL every null from the Dream11 app (team-creation screen).
# The optimizer refuses to run while any value is null.
# Source of the filled values: docs/components-map.png ("Dream11 rules (settings): 11 players, 100 credits,
# role limits, max 7 per side, captain 2x, vice-captain 1.5x; verified in the app").
# Role limits are not in any document yet: copy them from the app ("Pick 1-8 wicket-keepers" style text).
# Confirmed from the user's Dream11 app screenshots (Pakistan vs Sri Lanka 3rd T20I, 12 Oct 2026):
#   11 players; credit budget 100 (86.5 used + 13.5 left; 89 + 11); captain 2x, vice-captain 1.5x.
#   Accepted teams show WK 1-3, BAT 2-3, AR 3-5, BOWL 2-3 and 6:5 / 5:6 per side: these are NOT the limits,
#   only teams the app allowed. max_per_side 7 is still from the components map (TODO-CONFIRM in the app).
# Role limits from the user's own test in the app (T20, 12 Oct 2026): the app requires at least 1 WK, 1 BAT,
#   1 AR and 1 BOWL; 7 bowlers and 7 all-rounders could be selected. Max set to 7 (the most observed), so every
#   team we build is one the app accepts. TODO-CONFIRM: whether 8 of one role is allowed, and whether ODI and
#   Test use the same limits (assumed the same as T20).

T20:
  players: 11
  credit_budget: 100
  max_per_side: 7
  captain_multiplier: 2
  vc_multiplier: 1.5
  role_limits:
    WK: {min: 1, max: 7}
    BAT: {min: 1, max: 7}
    AR: {min: 1, max: 7}
    BOWL: {min: 1, max: 7}

